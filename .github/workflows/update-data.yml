name: Update Healthy Home Index and deploy
on:
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * 1,4'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: homenhealthy-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests
      - name: Verify Census secret
        run: test -n "$CENSUS_API_KEY" || (echo "::error::Missing repository secret CENSUS_API_KEY" && exit 1)
      - name: Refresh EPA, NOAA and Census data
        run: python scripts/update_data.py
      - name: Commit refreshed data
        run: |
          git config user.name "homenhealthy-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Refresh Healthy Home Index"
          git push
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload refreshed site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy refreshed site
        id: deployment
        uses: actions/deploy-pages@v4
